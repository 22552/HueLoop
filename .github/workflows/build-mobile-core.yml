name: Build HueLoop mobile FFmpeg core

# Rebuild after memory-growth and output-file fixes.
on:
  workflow_dispatch:
  push:
    paths:
      - core-build/**
      - .github/workflows/build-mobile-core.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: hueloop
      - name: Fetch pinned ffmpeg.wasm core sources
        run: |
          git init source
          git -C source remote add origin https://github.com/ffmpegwasm/ffmpeg.wasm.git
          git -C source fetch --depth 1 origin f876f907c7e9b9bf51d4ed0b913a855a63ae63fc
          git -C source checkout --detach FETCH_HEAD
      - name: Build minimal single-thread core
        run: |
          cp hueloop/core-build/Dockerfile source/Dockerfile
          docker buildx build --output type=local,dest=out source
      - name: Publish to the CDN branch
        working-directory: hueloop
        run: |
          git checkout --orphan ffmpeg-core
          git rm -rf .
          mkdir -p esm
          cp ../out/dist/esm/ffmpeg-core.js esm/
          cp ../out/dist/esm/ffmpeg-core.wasm esm/
          printf '%s\n' 'HueLoop mobile FFmpeg core. Source and build configuration are on main.' > README.md
          git add esm README.md
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot] commit -m 'Publish lightweight FFmpeg core'
          git push --force origin HEAD:ffmpeg-core
